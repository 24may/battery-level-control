name: EcoFlow battery status

on:
  schedule:
    # Twice an hour, at :00 and :30. Note: GitHub may delay scheduled
    # runs under load, and disables the schedule after 60 days with no
    # repo activity. Only schedules on the default branch run.
    - cron: "0,30 * * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Avoid overlapping runs if one is delayed/queued.
concurrency:
  group: battery-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Environment that holds the TUYA_* secrets (Settings → Environments → tuya).
    # Repo-level secrets/vars stay available alongside the environment's ones.
    environment: tuya
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Read battery status
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          ECOFLOW_SN: ${{ vars.ECOFLOW_SN }}        # optional; blank = first bound device
          # Fallback here, not in the script: an unset repo var arrives as "" and
          # os.getenv's default would not kick in, leaving the host empty.
          ECOFLOW_HOST: ${{ vars.ECOFLOW_HOST || 'https://api-e.ecoflow.com' }}
          # Tuya smart plug: switched OFF when PD SoC reaches 100%.
          # Leave CLIENT_ID/SECRET/DEVICE_ID unset to disable plug control.
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_SECRET: ${{ secrets.TUYA_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          TUYA_SWITCH_CODE: ${{ secrets.TUYA_SWITCH_CODE || 'switch_1' }}
          TUYA_HOST: ${{ vars.TUYA_HOST || 'https://openapi.tuyaeu.com' }}
          # "Re-run jobs → Enable debug logging" in the Actions UI switches to DEBUG;
          # otherwise use the LOG_LEVEL repo variable, defaulting to INFO.
          LOG_LEVEL: ${{ runner.debug == '1' && 'DEBUG' || vars.LOG_LEVEL || 'INFO' }}
        run: python ecoflow_delta2_status1.py
